---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.3.1
serverless_language: node
refresh_interval_floor: ''

# Expected polling JSON: { "schema_version": 1, "items": [exhibit, ...] }
# items must be a top-level array. Bare arrays/results wrappers are unsupported.
# Missing, malformed or empty items produce the explicit unavailable screen.
polling_url: https://raw.githubusercontent.com/michaelkurath/TRMNL-Still-Here/main/data/trmnl.json
polling_headers: ''
polling_body: ''
id: 498915
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About STILL HERE
  category: custom,education
  description: A museum of species, technologies, and places that unexpectedly survive.
  github_url: https://github.com/michaelkurath/TRMNL-Still-Here
- keyname: category
  name: Category
  field_type: select
  options:
  - All categories: all
  - Technology: technology
  - Internet: internet
  - Transport: transport
  - Nature: nature
  - Everyday life: everyday
  default: all
  description: Choose from all entries or one category. Every entry is shown once before the rotation repeats.
  optional: true
name: STILL HERE
description: Unexpected survivors, still here.
refresh_interval: 15
