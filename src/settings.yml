---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.3.1
serverless_language: node
refresh_interval_floor: ''
polling_url: https://raw.githubusercontent.com/michaelkurath/TRMNL-Still-Here/main/data/poll.json
polling_headers: ''
polling_body: ''
id: 498915
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_bio
  field_type: author_bio
  name: About STILL HERE
  category: custom,education
  description: A museum of species, technologies, and places that unexpectedly survive.
  github_url: https://github.com/michaelkurath/TRMNL-Still-Here
- keyname: category
  name: Category
  field_type: select
  options:
  - All categories: all
  - Technology: technology
  - Internet: internet
  - Transport: transport
  - Nature: nature
  - Everyday life: everyday
  default: all
  description: Choose from all entries or one category. Every entry is shown once before the rotation repeats.
  optional: true
- keyname: display_edition
  name: Display edition
  field_type: select
  options:
  - Automatic: auto
  - Classic: classic
  - Frame: frame
  default: auto
  conditional_validation:
  - when: auto
    visible: [exhibit_ids]
  - when: classic
    visible: [exhibit_ids]
  - when: frame
    visible: [frame_exhibit_ids]
  description: Automatic uses the gallery layout on TRMNL Frame. Choose Classic or Frame to override the full-screen layout.
  optional: true
- keyname: exhibit_mode
  name: Exhibit rotation
  field_type: select
  options:
  - Full Collection: all
  - My Selection: selected
  default: all
  description: My Selection uses your chosen exhibits across categories.
  optional: true
- keyname: exhibit_ids
  name: My exhibits
  field_type: xhrSelect
  endpoint: https://michaelkurath.github.io/TRMNL-Still-Here/exhibits-auto.json
  http_verb: GET
  exclude_csrf_token: true
  multiple: true
  description: Use My Selection to keep one exhibit on screen or rotate through several.
  optional: true
- keyname: frame_exhibit_ids
  name: My Frame exhibits
  field_type: xhrSelect
  endpoint: https://michaelkurath.github.io/TRMNL-Still-Here/exhibits-frame.json
  http_verb: GET
  exclude_csrf_token: true
  multiple: true
  description: Use My Selection to show your chosen colour exhibits.
  optional: true
- keyname: frame_caption
  name: Frame presentation
  field_type: select
  options:
  - Artwork only: artwork
  - Caption overlay: overlay
  default: artwork
  description: Show full-screen artwork alone or add a short description in the corner.
  optional: true
- keyname: frame_show_title
  name: Show title in Artwork only
  field_type: boolean
  default: false
  description: Add the exhibit title when Frame presentation is set to Artwork only.
  optional: true
name: STILL HERE
description: Unexpected survivors, still here.
refresh_interval: 15
